spring:
  application:
    name: kirana-backend
  config:
    # Local dev reads the monorepo root .env (when run from backend/) or a local one
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/kirana}
    username: ${DB_USER:kirana}
    password: ${DB_PASSWORD:kirana}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 30d
  encryption-key: ${APP_ENCRYPTION_KEY:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  otp:
    # logging (prints the code, dev only) or msg91
    provider: ${OTP_PROVIDER:logging}
    ttl: 5m
    max-attempts: 5
    resend-after: 30s
    max-sends-per-hour: 5
    # Per client address (all phones together); stops SMS pumping. 0 disables.
    max-sends-per-ip-per-hour: 20
    # Numbers that always accept test-code: demo/review accounts only (dev profile sets its own). Empty = none.
    test-numbers: ${OTP_TEST_NUMBERS:}
    test-code: "123456"
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      base-url: https://control.msg91.com
  media:
    dir: ${MEDIA_DIR:./media}
  orders:
    pending-payment-expiry: 15m
  payments:
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    razorpay-base-url: https://api.razorpay.com
