<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <!-- Apply the saved theme before first paint so dark mode never flashes white (see src/lib/theme.tsx) -->
    <script>
      try {
        var t = localStorage.getItem("kirana.admin.theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; }
      } catch (e) {}
    </script>
    <title>Kirana Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
